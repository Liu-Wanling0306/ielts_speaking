<body>
<header class="hero"><div class="shell"><div class="topline"><span>IELTS SPEAKING · PERSONAL PRACTICE</span><span id="version" class="version">v1.0.0</span></div><h1>IELTS Speaking Lab <span>个人素材训练库</span></h1><p>从真实素材到主动表达：先记故事骨架，再练搭配、复述和换题迁移。</p><div class="hero-tags"><span>11.23–11.29 来源资料</span><span>Band 7.5 学习目标</span><span>固定网址 · 持续更新</span></div></div></header>
<div class="shell">
<nav aria-label="功能导航" class="nav"><button data-page="home">学习概览</button><button data-page="p1">Part 1 快速回答</button><button data-page="p2">Part 2 母素材迁移</button><button data-page="p3">Part 3 观点分析</button><button data-page="phrases">搭配表达库</button><button data-page="review">个人复盘</button><button data-page="versions">版本与备份</button></nav>
<p id="loadStatus" role="status">正在读取资料……</p>
<main id="content" tabindex="-1"></main>
<footer><p>个人练习资料，不是 IELTS 官方题库或评分承诺。草稿与练习进度保存在当前浏览器，可通过 JSON 备份迁移。</p><a href="https://github.com/Liu-Wanling0306/ielts_speaking" target="_blank" rel="noopener">GitHub 源码与历史</a> · <a href="source/original-upload.html" target="_blank" rel="noopener">上传原文件存档</a><span id="saveState" role="status"></span></footer>
</div>
<script>
(async()=>{try{const read=async url=>{const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw Error(url+' '+r.status);return r.json()};const [library,releases]=await Promise.all([read('data/library.json'),read('data/releases.json')]);window.SPEAKING_DATA={library,releases};const s=document.createElement('script');s.src='app.js?v='+encodeURIComponent(library.meta.version);s.onerror=()=>{document.getElementById('loadStatus').textContent='程序加载失败，请刷新重试。'};document.body.appendChild(s)}catch(e){document.getElementById('loadStatus').textContent='资料加载失败：'+e.message+'。请通过网站或本地HTTP服务打开。'}})();
</script>
</body></html>
